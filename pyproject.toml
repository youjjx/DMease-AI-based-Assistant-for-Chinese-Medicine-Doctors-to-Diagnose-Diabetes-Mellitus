[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmease"
version = "1.0.0"
description = "AI-based assistant framework for TCM doctors diagnosing and treating diabetes mellitus."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DMease Authors" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "streamlit>=1.53,<2",
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
research = ["matplotlib>=3.8,<4"]
affinity = ["rdkit>=2024.9", "scipy>=1.12"]
local-llm = ["transformers>=4.57,<5", "huggingface-hub>=0.34,<1", "safetensors>=0.5", "lm-format-enforcer==0.11.3"]

[project.scripts]
dmease = "dmease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=.pytest-tmp"

